name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies & Build Web App
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://aura-family-hub-2cgg5gpa7a-nw.a.run.app' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '600050762948-bqe3traltdnne31fmu99p1hn9n1ubgb8.apps.googleusercontent.com' }}
        run: |
          npm install --include=optional --force
          npm run build

      - name: Setup Java (Android SDK requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (Manual)
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT
          cd /tmp
          curl -fsSL -o commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
          
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true

      - name: Setup Android Platform & Permissions
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync
          node scripts/ensure-android-permissions.mjs

      - name: Configure Release Signing Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/release-keystore.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-aurafamily}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using permanent release keystore from GitHub Secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — generating a temporary release keystore for this build. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Secrets for consistent app updates."
            TEMP_PASS="AuraFamilyRelease2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias aurafamily \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -dname "CN=AuraFamily, OU=FamilyAI, O=AuraFamily, L=London, ST=UK, C=GB"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=aurafamily" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
