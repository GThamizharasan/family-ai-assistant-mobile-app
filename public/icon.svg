<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="aura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#a855f7" stroke-opacity="0.35" />

  <!-- Glowing Core Shield & Aura -->
  <circle cx="256" cy="256" r="88" fill="url(#aura)" filter="url(#glow)" opacity="0.4" />
  
  <!-- Central Family Crest / AI Node -->
  <path d="M256 120 L350 170 L350 280 C350 350 256 400 256 400 C256 400 162 350 162 280 L162 170 Z" 
        fill="url(#aura)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Sparkle & Crown (Billionaire & Family) -->
  <polygon points="256,180 270,215 305,220 280,245 285,280 256,260 227,280 232,245 207,220 242,215" fill="url(#gold)" />
  
  <!-- Pulse Wave Lines -->
  <path d="M200 320 Q256 345 312 320" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="333" r="5" fill="#34d399" />
</svg>
