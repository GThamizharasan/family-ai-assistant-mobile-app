    <script>
      // Safe WebSocket mock and error suppression for Vite HMR in cloud preview environments where WebSocket is disabled
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          class ViteSafeWebSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              const isVite = protocols === 'vite-hmr' || protocols === 'vite-ping' || 
                (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));
              if (!isVite) {
                return new NativeWebSocket(url, protocols);
              }
              this.url = String(url || '');
              this.protocols = protocols;
              this.readyState = 1; // WebSocket.OPEN
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] : '');
              this.binaryType = 'blob';

              setTimeout(() => {
                const openEv = new Event('open');
                if (typeof this.onopen === 'function') {
                  this.onopen(openEv);
                }
                this.dispatchEvent(openEv);
              }, 0);
            }

            send(data) {}

            close(code, reason) {
              this.readyState = 3;
              setTimeout(() => {
                const closeEv = typeof CloseEvent !== 'undefined' 
                  ? new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' })
                  : new Event('close');
                if (typeof this.onclose === 'function') {
                  this.onclose(closeEv);
                }
                this.dispatchEvent(closeEv);
              }, 0);
            }
          }

          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;

          try {
            Object.defineProperty(ViteSafeWebSocket, Symbol.hasInstance, {
              value: (instance) => instance instanceof NativeWebSocket || instance instanceof ViteSafeWebSocket || instance instanceof EventTarget
            });
          } catch (e) {}

          window.WebSocket = ViteSafeWebSocket;
        }

        // Unregister stale service workers that may intercept requests with corrupted dev caches
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }

        // Gracefully ignore WebSocket HMR notifications when HMR is disabled in AI Studio preview
        const _origError = console.error;
        console.error = function(...args) {
          const isViteWs = args.some(arg => {
            const str = String(arg || '');
            return str.includes('WebSocket closed without opened') || 
                   (str.includes('[vite]') && str.includes('WebSocket')) ||
                   (arg instanceof Error && (arg.message?.includes('WebSocket') || arg.stack?.includes('@vite/client')));
          });
          if (isViteWs) return;
          _origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client') || (e.error && String(e.error).includes('WebSocket')))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && (String(e.reason).includes('WebSocket') || (e.reason && e.reason.stack && String(e.reason.stack).includes('@vite/client')))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <script>
      // OAuth Mobile Callback Bounce Handler (handles callbacks if SPA index.html is served)
      (function() {
        try {
          var h = window.location.hash || '';
          var s = window.location.search || '';
          if (h.indexOf('access_token=') !== -1 || s.indexOf('access_token=') !== -1) {
            var raw = h.replace(/^#/, '') + '&' + s.replace(/^\?/, '');
            var params = new URLSearchParams(raw);
            var keep = new URLSearchParams();
            ['access_token', 'expires_in', 'state', 'error', 'scope'].forEach(function (k) {
              if (params.get(k)) keep.set(k, params.get(k));
            });
            var q = keep.toString();
            var intentUrl = 'intent://oauth?' + q + '#Intent;scheme=com.family.ai.assistant;package=com.family.ai.assistant;end';
            var schemeUrl = 'com.family.ai.assistant://oauth?' + q;
            var isAndroid = /Android/i.test(navigator.userAgent);
            var target = isAndroid ? intentUrl : schemeUrl;

            // Render interactive bounce card in case automatic intent redirect is blocked by Chrome
            var showOverlay = function() {
              if (document.getElementById('oauth-mobile-bounce-overlay')) return;
              var div = document.createElement('div');
              div.id = 'oauth-mobile-bounce-overlay';
              div.style.cssText = 'position:fixed;inset:0;background:#090d16;z-index:9999999;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;padding:16px;';
              div.innerHTML = '<div style="padding:32px 24px;max-width:360px;width:100%;background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.6);">' +
                '<h2 style="margin:0;font-size:20px;font-weight:700;color:#f8fafc;">Signed in with Google</h2>' +
                '<p id="bounce-msg" style="color:#94a3b8;font-size:14px;margin:12px 0 0;">Returning to AuraFamily mobile app…</p>' +
                '<a id="bounce-btn" href="' + target + '" style="display:inline-block;margin-top:20px;padding:14px 28px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 8px 20px rgba(59,130,246,0.4);">Open AuraFamily App</a>' +
              '</div>';
              if (document.body) {
                document.body.appendChild(div);
              } else if (document.documentElement) {
                document.documentElement.appendChild(div);
              }
              var btn = div.querySelector('#bounce-btn');
              if (btn) {
                btn.addEventListener('click', function() {
                  setTimeout(function() { window.location.href = schemeUrl; }, 300);
                });
              }
            };

            if (document.body || document.documentElement) {
              showOverlay();
            } else {
              window.addEventListener('DOMContentLoaded', showOverlay);
            }

            try {
              window.location.replace(target);
            } catch (e) {
              window.location.replace(schemeUrl);
            }
          }
        } catch (e) {}
      })();
    </script>
